name: stage1_final_completion_plan
active_plan: true
default_timeout_seconds: 7200
jobs:
- id: patch_gates
  owner: shared
  method: repository
  round: final_completion
  evidence_category: diagnostics
  protocol: infrastructure
  variant: final_patch
  heavy: false
  enabled: true
  dependencies: []
  command: python -m pytest -q
  expected_outputs:
  - results/status/runs.csv
  retry_policy: fix_once_then_block
  timeout_seconds: 600
- id: resource_inventory
  owner: shared
  method: environment
  round: final_completion
  evidence_category: infrastructure
  protocol: resource_inventory
  variant: hardware_gate
  heavy: false
  enabled: true
  dependencies:
  - patch_gates
  command: nvidia-smi; free -h; df -h; lscpu
  expected_outputs:
  - results/evidence/infrastructure/stage1_final_resource_inventory_20260804_123140/summary.json
  retry_policy: record_blocker
  timeout_seconds: 300
- id: final_attempts
  owner: shared
  method: all_remaining_methods
  round: final_completion
  evidence_category: mixed
  protocol: bounded_attempts
  variant: no_planned_methods
  heavy: true
  enabled: true
  dependencies:
  - resource_inventory
  command: python workflows/experiment/stage1_final_attempts.py --stamp 20260804_123140
  expected_outputs:
  - results/status/stage1_completion_state.json
  retry_policy: one_standard_plus_one_fallback
  timeout_seconds: 7200
- id: registry_refresh
  owner: shared
  method: registry
  round: final_completion
  evidence_category: infrastructure
  protocol: aggregation
  variant: dynamic_status
  heavy: false
  enabled: true
  dependencies:
  - final_attempts
  command: python workflows/aggregate/build_run_registry.py --write
  expected_outputs:
  - results/status/runs.csv
  - results/status/methods.csv
  - results/status/completion_audit.json
  retry_policy: fix_once_then_block
  timeout_seconds: 600
- id: final_validation
  owner: shared
  method: repository
  round: final_completion
  evidence_category: diagnostics
  protocol: validation
  variant: final_static_and_registry
  heavy: false
  enabled: true
  dependencies:
  - registry_refresh
  command: pytest -q; python -m compileall -q methods workflows tests; git diff --check
  expected_outputs: []
  retry_policy: fix_once_then_block
  timeout_seconds: 900
